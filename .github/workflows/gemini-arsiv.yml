name: Gemini Arsiv Uret ve Yayinla

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      gun_sayisi:
        description: 'Bu turda uretilecek gun sayisi'
        required: false
        default: '5'
        type: string

permissions:
  contents: write

concurrency:
  group: arsiv-yayin
  cancel-in-progress: false

jobs:
  arsiv-uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: pip install requests

      - name: Git kimligi ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Gemini ile arsiv ozetlerini uret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUN_SAYISI: ${{ inputs.gun_sayisi || '5' }}
        run: python gorev/gemini_arsiv.py
