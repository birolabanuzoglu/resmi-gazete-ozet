name: Mistral Arsiv Uret ve Yayinla

# Mistral La Plateforme ucretsiz "Experiment" plani (anahtar: secret MISTRAL_API_KEY).
# Anahtar eklenmeden tur bir saniyede "atlandi" diye biter.
on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:
    inputs:
      gun_sayisi:
        description: 'Bu turda uretilecek gun sayisi'
        required: false
        default: '25'
        type: string

permissions:
  contents: write

concurrency:
  group: mistral-arsiv
  cancel-in-progress: false

jobs:
  mistral-arsiv-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bagimliliklari kur
        run: pip install requests
      - name: Git kimligi ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Mistral ile arsiv uret
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GUN_SAYISI: ${{ inputs.gun_sayisi || '25' }}
        run: python -u gorev/mistral_arsiv.py
