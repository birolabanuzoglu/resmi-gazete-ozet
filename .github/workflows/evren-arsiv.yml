name: Evren Arsiv (Devre Disi - Yalnizca Elle)

on:
  workflow_dispatch:
    inputs:
      gun_sayisi:
        description: 'Bu turda uretilecek gun sayisi'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

concurrency:
  group: evren-arsiv
  cancel-in-progress: false

jobs:
  evren-arsiv-uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bagimliliklari kur
        run: pip install requests
      - name: Git kimligi ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Evren ile arsiv uret
        env:
          EVREN_API_KEY: ${{ secrets.EVREN_API_KEY }}
          GUN_SAYISI: ${{ inputs.gun_sayisi || '10' }}
        run: python -u gorev/evren_arsiv.py
