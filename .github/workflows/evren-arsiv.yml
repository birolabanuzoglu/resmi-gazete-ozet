name: Evren Hizli Arsiv Uret ve Yayinla

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      gun_sayisi:
        description: 'Bu turda uretilecek gun sayisi'
        required: false
        default: '25'
        type: string

permissions:
  contents: write

concurrency:
  # Zamanlanmis turlar tek grupta sirayla calisir; elle baslatilan her tur kendi grubunda, yani
  # birbirini ve zamanlanmis turu beklemeden paralel calisir (gunleri arsiv.py ayirir).
  group: ${{ github.event_name == 'workflow_dispatch' && format('evren-arsiv-elle-{0}', github.run_id) || 'evren-arsiv' }}
  cancel-in-progress: false

jobs:
  evren-arsiv-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bagimliliklari kur
        run: pip install requests
      - name: Git kimligi ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Evren hizli modeller ile arsiv uret
        env:
          EVREN_API_KEY: ${{ secrets.EVREN_API_KEY }}
          GUN_SAYISI: ${{ inputs.gun_sayisi || '25' }}
        run: python -u gorev/evren_arsiv.py
